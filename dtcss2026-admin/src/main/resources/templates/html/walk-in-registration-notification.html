<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場登錄成功通知</title>
    <style>
        body {
            font-size: 1.2rem;
            line-height: 1.8;
        }

        td {
            padding: 10px 0;
        }
    </style>
</head>

<body>
    <table cellpadding="0" cellspacing="0" border="0" width="640" style="max-width:640px;">
        <tr>
            <td>
                <img th:if="${!#strings.isEmpty(bannerPhotoUrl)}" th:src="${bannerPhotoUrl}" alt="Conference Banner" width="640"
                    style="max-width: 100%; width: 640px; display: block; object-fit:cover;">
            </td>
        </tr>
        <tr>
            <td style="text-align: center;font-size:2rem;">
                您好，感謝您參與此次 [[${conferenceName}]] !
            </td>
        </tr>
        <tr>
            <td style="text-align: center;">
                以下是簽到 QRcode 請至大會報到處直接掃描，快速通關進入會場
            </td>
        </tr>
        <tr>
            <td style="text-align: center;">
                <img src="${domain}/prod-api/attendees/qrcode?attendeesId=[[${attendeesId}]]"
                    alt="QR Code" />
            </td>
        </tr>
        <tr>
            <td style="text-align: center;">
                若您無法看到 QR Code，請改用 HTML 格式開啟信件，或現場向服務人員出示報名信息。
            </td>
        </tr>
        <tr>
            <td style="font-size: 0.9rem; color: #777;">
                <br><br><br>
                本信件由大會系統自動發送，請勿直接回信
            </td>
        </tr>
    </table>
</body>

</html>
